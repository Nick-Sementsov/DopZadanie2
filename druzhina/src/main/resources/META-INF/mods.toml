modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Nick-Sementsov/DopZadanie2/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Nick-Sementsov/DopZadanie2"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The soldiers fight by the rules of Knightly Combat
[[dependencies.${mod_id}]]
    modId="knightcombat"
    mandatory=true
    versionRange="[2.8.0,)"
    ordering="AFTER"
    side="BOTH"
