modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Nick-Sementsov/DopZadanie2/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Nick-Sementsov/DopZadanie2"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The soldiers fight by the rules of Knightly Combat
[[dependencies.${mod_id}]]
    modId="knightcombat"
    mandatory=true
    versionRange="[2.11.0,)"
    ordering="AFTER"
    side="BOTH"

# Every soldier is armed and armoured from Epic Knights
[[dependencies.${mod_id}]]
    modId="magistuarmory"
    mandatory=true
    versionRange="[10.0,)"
    ordering="AFTER"
    side="BOTH"

# More arms and armour when these addons are there: the mail and scale of the Rus, more swords, axes and spears
[[dependencies.${mod_id}]]
    modId="slavicarmory"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="magistuarmoryaddon"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
