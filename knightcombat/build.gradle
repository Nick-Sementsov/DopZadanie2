plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Runs processResources on the IDE output folders before launching the game.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mods with mixins (Epic Knights, Architectury) need their mixins remapped to the development names
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Mods for the development game that are not on Modrinth: their jars are put into knightcombat/devmods (not in git).
    flatDir { dirs 'devmods' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Epic Knights and its addons in the development game, to try the mod with them:
    // ./gradlew :knightcombat:runClient -PepicKnights
    // The mod itself does not depend on them; it reads their weapons at runtime.
    // Versions are given by their Modrinth ids, because the Forge and Fabric files of a mod share version numbers.
    if (project.hasProperty('epicKnights')) {
        runtimeOnly fg.deobf('maven.modrinth:epic-knights-shields-armor-and-weapons:gJ59URg4') // 10.15 for Forge
        runtimeOnly fg.deobf('maven.modrinth:epic-knights-addon:xnYQSIH7') // 2.6
        runtimeOnly fg.deobf('maven.modrinth:epic-knights-slavic-armory:Q5VtlZ47') // 2.1
        runtimeOnly fg.deobf('maven.modrinth:epic-knights-antique-legacy:4DhbZFhg') // 1.13
        runtimeOnly fg.deobf('maven.modrinth:architectury-api:1MKTLiiG') // 9.2.14
        runtimeOnly fg.deobf('maven.modrinth:cloth-config:t8TXrZvZ') // 11.1.136
        // Epic Knights: Dark Ages is only on CurseForge: put its jar into knightcombat/devmods as epic-knights-dark-ages-1.1.jar.
        if (file('devmods/epic-knights-dark-ages-1.1.jar').exists()) {
            runtimeOnly fg.deobf('devmods:epic-knights-dark-ages:1.1')
        }
    }

    // Unit tests for the parts of the combat rules that do not need Minecraft classes
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Fills ${...} placeholders in mods.toml and pack.mcmeta with the values from gradle.properties
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Remaps the jar to the names used by a normal Minecraft installation
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
