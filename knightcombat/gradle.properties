mod_description=Melee combat in the spirit of medieval team brawlers: directional slashes, overheads and stabs\nwith wind-up, release and recovery, combos, feints, parries, ripostes, counters, kicks, stamina and battle cries.\nNine medieval weapons, and vanilla swords and axes join in too.
