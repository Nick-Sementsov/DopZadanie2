## Mod Properties

# The unique mod identifier for the mod. Must match the MODID constant in the main mod class.
mod_id=knightcombat
# The human-readable display name for the mod.
mod_name=Knightly Combat
# The license of the mod.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=2.7.0
# The group ID for the mod; matches the base package of the sources.
mod_group_id=io.github.nicksementsov.knightcombat
# The authors of the mod.
mod_authors=Nick-Sementsov
# The description of the mod shown in the mod list.
mod_description=Melee combat in the spirit of medieval team brawlers: directional slashes, overheads and stabs\nwith wind-up, release and recovery, combos, feints, parries, ripostes, counters, kicks, stamina and battle cries,\nwith sparks, blood and dust flying from the blows and recorded sounds of steel, wood and armour.\nWorks with the swords and axes of Minecraft, Epic Knights and its addons, and the weapons of other mods.
