[[mods]]
modId="prestol"
version="${mod_version}"
displayName="Престол — державы, войны и осады для MineColonies"
authors="Nick"
description='''
Державы из поселений MineColonies: ступени поселений, столица, земли на карте Xaero, указы и законы,
дипломатия, война, осада ратуши и захват (оставить, разграбить, поработить), революция и мятеж.
Флаг державы — картинка Immersive Paintings, над ратушами висит флаг Betsy Ross.
Всё управление — в «Книге державы» (F7).
'''
displayTest="MATCH_VERSION"

